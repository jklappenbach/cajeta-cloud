# CI + release for the cajeta-cloud library (.cja) — the ecosystem-
# standard shape (cajeta-ml's workflow):
#
#   - push to main         → build + test (no publish)
#   - push a `v*` tag      → build + test + publish (GitHub Release + Olla)
#   - workflow_dispatch    → dry-run (build+test) or production (also publishes)
#
# Bare-runner flow: install the pinned cajeta toolchain from the cajeta
# repo's GitHub Release; ./run-tests.sh takes its Olla-fetch path for
# dev.cajeta.unit. The Olla publish authenticates with the job's GitHub
# identity token (trusted publishing; this repository is bound to
# dev.cajeta on Olla), and Olla signs the upload with dev.cajeta's held
# key; the repository holds no Olla secret. Releases up to 0.3.1 bridged through
# cajeta-logging's publish-sibling workflow because this repository had
# no publish token; from here they publish from this workflow.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        type: choice
        default: 'dry-run'
        options: [dry-run, production]

permissions:
  contents: write
  # Trusted publishing: the Olla publish authenticates with this job's OIDC
  # identity token; no OLLA_TOKEN secret exists on this repository.
  id-token: write

env:
  # Must match a release tag of jklappenbach/cajeta.
  #
  # v0.17.4 was inherited verbatim when this workflow was cloned from a
  # timeseries library. Its rationale named cajeta.math.optim, fft and
  # stats, which describe that library and not this one. cajeta-cloud
  # touches no math surface at all, so that floor was never this
  # library's floor.
  #
  # Every claim below was measured against this tree on 2026-09-21, on
  # the released binaries, with the artifact cache cleared between runs.
  #
  # 1. v0.17.4 CANNOT RUN this tree. It compiles the sources and the
  #    library archive, and then the test binary dies with SIGSEGV
  #    walking the drop chain out of ObjectStoreTest, before a single
  #    test reports. Measured with unit 0.2.0, which is exactly the pair
  #    this workflow installed. The pin was green in name only.
  # 2. The floor is NOT v0.29.0 and the comment should not pretend it
  #    is. v0.28.0 runs the suite green at 35 passed, 0 failed, 1
  #    skipped, exactly as v0.29.0 does, and neither says anything the
  #    other does not. Between those two this is alignment with the
  #    ecosystem's current release, not a capability the sources need.
  # 3. The unit peg has to move with it. A consumer's compiler re-checks
  #    a dependency archive's OWN sources, and the published
  #    dev.cajeta.unit 0.2.0 archive fails
  #    CAJETA_ERROR_CAPTURED_BORROW_PARAM on PredMatcher.pred — a symbol
  #    this library does not contain — under v0.28.0 and v0.29.0 alike.
  #    cajeta.json pegs unit 0.3.0, the first archive that stores that
  #    closure parameter with `#=`.
  #
  # Pin forward, never back. The floor was not bisected past these three
  # points, so the only honest statement is that v0.28.0 and v0.29.0 run
  # this tree and v0.17.4 does not.
  #
  # Raised to v0.35.0 with cajeta.json, the release that enforces the
  # field-store rule on dependency archives.
  #
  # Raised to v0.36.0 for the fleet republish.
  #
  # Raised to v0.38.0 for the fleet republish.
  #
  # Raised to v0.39.0 for the fleet republish.
  # Raised to v0.41.0 with identity selection (identity plan Unit 2).
  # Raised to v0.44.0, the first release without the stdlib crypto (crypto plan Unit 8).
  CAJETA_VERSION: v0.44.0

jobs:
  build-test:
    name: build + test (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cajeta-cloud
        uses: actions/checkout@v4

      - name: Install cajeta toolchain (${{ env.CAJETA_VERSION }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$CAJETA_VERSION" --repo jklappenbach/cajeta \
            --pattern 'cajeta_*_amd64.deb' --dir /tmp
          sudo apt-get update
          sudo apt-get install -y /tmp/cajeta_*_amd64.deb
          cajeta --version || true

      - name: Run the test suite
        timeout-minutes: 30
        run: ./run-tests.sh

      - name: Run the tour (self-checking)
        timeout-minutes: 20
        run: ./run-tour.sh

      - name: Build the release .cja
        id: build
        run: |
          set -euo pipefail
          # cajeta.json is the single source of truth for the version; it is
          # JSONC, so read it through the toolchain, not jq.
          VERSION="$(cajeta info | awk '/^[[:space:]]*version:/{print $2; exit}')"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from cajeta.json via 'cajeta info'" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$VERSION" ]; then
              echo "::error::tag v${tag_version} disagrees with cajeta.json version ${VERSION} — bump the manifest or retag" >&2
              exit 1
            fi
          fi
          cajeta build
          art="build/archive/dev.cajeta.cloud-${VERSION}.cja"
          [ -f "$art" ] || { echo "::error::expected $art after cajeta build" >&2; exit 1; }
          echo "artifact=$art" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify the skills are packed
        run: |
          set -euo pipefail
          cja="${{ steps.build.outputs.artifact }}"
          if ls skills/*.md >/dev/null 2>&1; then
            if cajeta archive list "$cja" | grep -q "skills/index.json"; then
              echo "skills packed: $(ls skills/*.md | wc -l) source(s)"
            else
              echo "::error::skills/ has skills but the .cja carries no skills/index.json"; exit 1
            fi
          fi

      - name: Upload .cja as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cajeta-cloud-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.artifact }}

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.build.outputs.version) }}
          name: cajeta-cloud ${{ steps.build.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.artifact }}

      - name: Publish to Olla
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production')
        uses: jklappenbach/cajeta/.github/actions/olla-publish@main
        with:
          cja-path: ${{ steps.build.outputs.artifact }}
          version: ${{ steps.build.outputs.version }}
